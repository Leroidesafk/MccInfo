plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
	maven {
		name = "Noxcrew"
		url = "https://maven.noxcrew.com/public"
		content {
			includeGroup "com.noxcrew.noxesium"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mccinfo" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

ext.jarVersion = project.version.toString()

if (file('custom/custom.gradle').exists()) {
	apply from: 'custom/custom.gradle'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	clientCompileOnly("com.noxcrew.noxesium:fabric:${project.noxesium_version}") {
		transitive = false
	}
	clientCompileOnly("com.noxcrew.noxesium:api:${project.noxesium_version}") {
		transitive = false
	}
}

processResources {
	def version = project.jarVersion
	inputs.property "version", version

	exclude "assets/mccinfo/spot_sync.example.json"

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	archiveVersion = "${project.minecraft_version}+${project.version}"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
